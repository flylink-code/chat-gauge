<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Gauge 侧栏原型 v2</title>
<style>
/* 静态原型：数据为合成样例。配色取自已校验的分类色（亮/暗各一组），按分类名固定，不随排名变化。 */
:root {
  --surface: #fcfcfb; --page: #f1f0ec; --card: #f6f5f2; --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #78766f;
  --line: rgba(11,11,11,.12); --grid: #e1e0d9; --accent: #2a78d6;
  --ok: #006300; --warn: #8a5a00; --danger: #b32d2d;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --cx: #9a988f;
  --on-c: #fff; --on-c4: #0b0b0b; --free: #e6e5df;
}
[data-theme="dark"] {
  --surface: #1a1a19; --page: #0d0d0d; --card: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #98968c;
  --line: rgba(255,255,255,.12); --grid: #2c2c2a; --accent: #3987e5;
  --ok: #0ca30c; --warn: #fab219; --danger: #ec6a6a;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --cx: #6d6b64;
  --free: #2c2c2a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.bench { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 3; }
.bench button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; }
.bench button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.stage { display: flex; gap: 24px; padding: 20px 16px 40px; align-items: flex-start; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 14px 18px; display: grid; gap: 14px; }
.nowrap { white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: 11.5px; }
h1 { font-size: 15px; margin: 0; }
h2 { font-size: 12px; margin: 0; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
.head { display: grid; gap: 6px; }
.title { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--ok); }
.dot.idle { background: var(--ink-3); }
.switch { margin-left: auto; font-size: 11.5px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hero { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.hero b { font-size: 26px; line-height: 1.1; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.hero .of { color: var(--ink-3); white-space: nowrap; }
.pct { font-weight: 650; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; font-size: 12px; white-space: nowrap; }
.pct.ok { color: var(--ok); } .pct.warn { color: var(--warn); } .pct.danger { color: var(--danger); }
.bar { height: 10px; border-radius: 5px; background: var(--free); display: flex; overflow: hidden; gap: 2px; }
.bar i { display: block; height: 100%; }
.bar .used { background: var(--accent); border-radius: 5px 0 0 5px; }
.bar .buf, .tile.hatch, .chipbox.hatch { background-image: repeating-linear-gradient(45deg, transparent 0 3px, color-mix(in srgb, var(--ink) 28%, transparent) 3px 4px); background-color: var(--free); }
.facts { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--ink-2); font-size: 12px; }
.facts span { white-space: nowrap; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(136px, 1fr)); gap: 8px; }
.metric { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); display: grid; gap: 1px; align-content: start; }
.metric .k { font-size: 11.5px; color: var(--ink-3); }
.metric .v { font-size: 17px; font-weight: 650; white-space: nowrap; }
.metric .s { font-size: 11.5px; color: var(--ink-3); }
.metric.na { border-style: dashed; background: transparent; }
.metric.na .v { color: var(--ink-3); font-weight: 500; }
details.why summary { cursor: pointer; color: var(--accent); font-size: 11.5px; list-style: none; }
details.why summary::-webkit-details-marker { display: none; }
details.why p { margin: 4px 0 0; font-size: 11.5px; color: var(--ink-2); }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 11.5px; padding: 2px 9px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.map { position: relative; width: 100%; border-radius: 6px; overflow: hidden; background: var(--surface); }
.tile { position: absolute; padding: 4px 6px; overflow: hidden; border-radius: 3px; color: var(--on-c); outline-offset: -2px; }
.tile:focus-visible { outline: 2px solid var(--ink); }
.tile .n { font-weight: 650; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.tile .t { font-size: 11px; opacity: .92; white-space: nowrap; display: block; }
.tile.dark-text { color: var(--on-c4); }
.tile.hatch { color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--surface); padding: 5px 8px; border-radius: 6px; font-size: 11.5px; max-width: 240px; display: none; }
.legend { display: grid; gap: 1px; margin: 0; padding: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 8px; align-items: center; padding: 3px 0; border-top: 1px solid var(--grid); }
.legend li:first-child { border-top: 0; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.legend.two li { grid-template-columns: 14px 1fr auto; }
details.why .legend { margin-top: 2px; }
.legend .nm { overflow-wrap: anywhere; }
.legend .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.legend .pc { text-align: right; width: 42px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.group-title { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
.placeholder { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; color: var(--ink-2); font-size: 12px; display: grid; gap: 4px; }
.statusbar { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12px; }
.statusbar .item { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.statusbar .warn { color: var(--warn); } .statusbar .danger { color: var(--danger); }
.notes { max-width: 440px; font-size: 12.5px; color: var(--ink-2); display: grid; gap: 8px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
</style>
</head>
<body>
<div class="bench" role="toolbar" aria-label="原型控制">
  <span class="muted">主题</span>
  <button data-k="theme" data-v="light">亮色</button><button data-k="theme" data-v="dark">暗色</button>
  <span class="muted">宽度</span>
  <button data-k="w" data-v="260">260</button><button data-k="w" data-v="320">320</button><button data-k="w" data-v="400">400</button>
</div>
<div class="stage" id="stage"></div>
<div class="tip" id="tip" role="tooltip"></div>
<script>
const params = new URLSearchParams(location.hash.slice(1));
const state = { theme: params.get('theme') || 'light', w: Number(params.get('w')) || 320 };
const nf = new Intl.NumberFormat('zh-CN');
const compact = (n) => n < 1000 ? String(n) : n < 999950 ? `${+(n / 1000).toFixed(1)}k` : `${+(n / 1e6).toFixed(2)}M`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 分类名到配色槽位固定映射；未见过的名称归入“其他”灰色，不循环取色。
const slots = { 'Messages': 1, 'System tools': 2, 'Skills': 3, 'System prompt': 4, 'MCP server instructions': 5, 'MCP tools': 6, 'Memory files': 7 };
const colorOf = (name) => slots[name] ? `var(--c${slots[name]})` : 'var(--cx)';

const claude = {
  title: '示例：检查侧栏在窄窗口中的布局', agent: 'Claude Code', state: '空闲', idle: true,
  used: 105189, window: 400000, source: '报告值', at: '11月25日 16:12',
  cache: { read: 102272, input: 105189 }, rate: 13.9, rateNote: '最近一次请求',
  cats: [['Messages', 84256], ['System tools', 13388], ['Skills', 4025], ['System prompt', 2382], ['MCP server instructions', 620], ['MCP tools', 364], ['Memory files', 154]],
  free: 261811, buffer: 33000, deferred: [['System tools (deferred)', 34605], ['MCP tools (deferred)', 21882]]
};
const agy = {
  title: '示例：浏览项目', agent: 'Antigravity', state: '运行中', idle: false,
  used: 364588, window: 1048576, source: '估算值', at: '11月25日 16:20', cache: null, rate: null, cats: null
};

function bar(d) {
  const pc = (n) => `${Math.max(0, n / d.window * 100)}%`;
  const bufferWidth = d.buffer ? `<i class="buf" style="width:${pc(d.buffer)}" title="压缩预留"></i>` : '';
  return `<div class="bar" role="img" aria-label="已用 ${nf.format(d.used)}，剩余 ${nf.format(d.window - d.used)} token"><i class="used" style="width:${pc(d.used)}"></i>${bufferWidth}</div>`;
}

function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((s, a) => s + a.v, 0);
  if (!total || w <= 0 || h <= 0) return out;
  const k = w * h / total;
  let rest = items.slice();
  while (rest.length) {
    const side = Math.min(w, h);
    const worst = (row) => {
      const areas = row.map((a) => a.v * k), s = areas.reduce((p, q) => p + q, 0);
      return Math.max(side * side * Math.max(...areas) / (s * s), s * s / (side * side * Math.min(...areas)));
    };
    let i = 1;
    while (i < rest.length && worst(rest.slice(0, i + 1)) <= worst(rest.slice(0, i))) i++;
    const row = rest.slice(0, i); rest = rest.slice(i);
    const s = row.reduce((p, a) => p + a.v * k, 0);
    if (w >= h) {
      const cw = s / h; let cy = y;
      for (const a of row) { const ch = a.v * k / cw; out.push({ a, x, y: cy, w: cw, h: ch }); cy += ch; }
      x += cw; w -= cw;
    } else {
      const rh = s / w; let cx = x;
      for (const a of row) { const cw = a.v * k / rh; out.push({ a, x: cx, y, w: cw, h: rh }); cx += cw; }
      y += rh; h -= rh;
    }
  }
  return out;
}

// mode=used: 只画已占用分类；mode=window: 再加上剩余与预留，面积代表整个窗口。
function mapFor(d, width, mode) {
  const height = Math.round(Math.min(210, Math.max(128, width * 0.62)));
  const total = mode === 'window' ? d.window : d.cats.reduce((s, c) => s + c[1], 0);
  const cats = d.cats.map(([name, tokens], i) => ({ name, tokens, index: i + 1 }));
  const minArea = 900;
  const small = cats.filter((c) => c.tokens / total * width * height < minArea);
  const big = cats.filter((c) => !small.includes(c));
  const items = big.map((c) => ({ v: c.tokens, c }));
  if (small.length >= 2) items.push({ v: small.reduce((s, c) => s + c.tokens, 0), merged: small });
  else small.forEach((c) => items.push({ v: c.tokens, c }));
  items.sort((p, q) => q.v - p.v);
  if (mode === 'window') {
    items.push({ v: d.free, free: true }, { v: d.buffer, buffer: true });
  }
  const tiles = squarify(items, 0, 0, width, height).map((t) => {
    const a = t.a, share = a.v / (mode === 'window' ? d.window : total) * 100;
    const label = a.free ? '剩余' : a.buffer ? '压缩预留' : a.merged ? `其他 ${a.merged.length} 项` : a.c.name;
    const color = a.free || a.buffer ? '' : a.merged ? 'var(--cx)' : colorOf(a.c.name);
    const tip = a.merged ? a.merged.map((c) => `${c.index} · ${c.name} ${nf.format(c.tokens)}`).join('\n') : `${nf.format(a.v)} token · ${share.toFixed(1)}%`;
    const num = a.c ? `${a.c.index} · ` : '';
    const big2 = t.w >= 76 && t.h >= 36, mid = t.w >= 30 && t.h >= 22;
    const text = big2 ? `<span class="n">${esc(num + label)}</span><span class="t">${compact(a.v)}</span>` : mid ? `<span class="n">${a.c ? a.c.index : a.merged ? '…' : ''}</span>` : '';
    const cls = ['tile', a.free || a.buffer ? 'hatch' : '', a.c && a.c.name === 'System prompt' ? 'dark-text' : ''].join(' ');
    return `<div class="${cls}" tabindex="0" data-tip="${esc(label + '\n' + tip)}" aria-label="${esc(label + ' ' + tip.replace(/\n/g, '，'))}"
      style="left:${t.x}px;top:${t.y}px;width:${Math.max(0, t.w - 2)}px;height:${Math.max(0, t.h - 2)}px;${color ? `background:${color}` : ''}">${text}</div>`;
  });
  return { height, html: tiles.join(''), merged: small.length >= 2 ? small : [] };
}

function legend(d, mode) {
  const usedTotal = d.cats.reduce((s, c) => s + c[1], 0);
  const base = mode === 'window' ? d.window : usedTotal;
  const row = (sw, name, n, pctOf) => `<li><span class="sw" style="${sw}"></span><span class="nm">${esc(name)}</span><span class="num">${nf.format(n)}</span><span class="pc">${(n / pctOf * 100).toFixed(1)}%</span></li>`;
  const used = d.cats.map(([name, n], i) => row(`background:${colorOf(name)}`, `${i + 1} · ${name}`, n, base)).join('');
  const rest = [row('background:var(--free)', '剩余空间', d.free, d.window), row('background:var(--free)', '压缩预留', d.buffer, d.window)].join('');
  const deferred = d.deferred.map(([name, n]) => `<li><span class="sw chipbox hatch"></span><span class="nm">${esc(name)}</span><span class="num">${nf.format(n)}</span></li>`).join('');
  return `<ul class="legend" aria-label="分类明细">${used}</ul>
    <details class="why"><summary>剩余、压缩预留与按需加载</summary>
      <div class="group-title">未用空间 · 占窗口 ${((d.window - usedTotal) / d.window * 100).toFixed(0)}%</div><ul class="legend">${rest}</ul>
      <div class="group-title">按需加载 · 不占当前窗口</div><ul class="legend two">${deferred}</ul></details>`;
}

function panel(d, width, mode) {
  const pct = Math.round(d.used / d.window * 100);
  const tone = pct >= 90 ? 'danger' : pct >= 75 ? 'warn' : 'ok';
  const cache = d.cache ? `<div class="metric"><span class="k">提示词缓存命中</span><span class="v">${(d.cache.read / d.cache.input * 100).toFixed(1)}%</span><span class="s">缓存读取 ${compact(d.cache.read)} / 输入 ${compact(d.cache.input)}</span></div>` : '';
  const rate = d.rate
    ? `<div class="metric"><span class="k">平均输出速率</span><span class="v">≈${d.rate} tok/s</span><span class="s">${d.rateNote} · 含首 token 等待</span></div>`
    : `<div class="metric na"><span class="k">平均输出速率</span><span class="v">暂无</span><details class="why"><summary>为什么没有？</summary><p>Orca 目前没有保存 Antigravity 每轮的输出 token 数与耗时，插件不会用上下文增量去估算。</p></details></div>`;
  const breakdown = d.cats ? (() => {
    const map = mapFor(d, width - 30, mode);
    return `<section style="display:grid;gap:8px"><div class="sec-head"><h2>上下文构成</h2><span class="seg" role="group" aria-label="范围"><button aria-pressed="${mode === 'used'}" data-mode="used">已占用</button><button aria-pressed="${mode === 'window'}" data-mode="window">整个窗口</button></span></div>
      <div class="map" style="height:${map.height}px">${map.html}</div>
      <div class="small muted">面积按 token 数分配 · 报告于 ${d.at}${map.merged.length ? ` · 第 ${map.merged.map((c) => c.index).join('、')} 项太小，图中合并为灰色块` : ''}</div>${legend(d, mode)}</section>`;
  })() : `<div class="placeholder"><b>没有分类明细</b><span>Antigravity 只向 Orca 报告已用总量和窗口上限。需要分类时，可在 agy 终端里用 /context 查看。</span></div>`;
  return `<div class="panel" style="width:${width}px">
    <div class="head"><div class="title" title="${esc(d.title)}">${esc(d.title)}</div>
      <div class="meta"><span class="chip">${d.agent}</span><span class="chip"><span class="dot ${d.idle ? 'idle' : ''}"></span>${d.state}</span><button class="switch">切换对话</button></div></div>
    <div class="card"><div class="row"><h2>上下文窗口</h2><span class="pct ${tone}">${pct}%</span></div>
      <div class="hero"><b>${compact(d.used)}</b><span class="of">/ ${compact(d.window)} token</span></div>
      ${bar(d)}
      <div class="facts"><span>已用 ${nf.format(d.used)}</span><span>剩余 ${nf.format(d.window - d.used)}</span></div>
      <div class="small muted">${d.buffer ? `剩余中含压缩预留 ${compact(d.buffer)}（斜纹）· ` : ''}${d.source} · ${d.at}</div></div>
    <div class="metrics">${cache}${rate}</div>
    ${breakdown}</div>`;
}

function statusItems() {
  const item = (text, cls, caption) => `<div class="statusbar"><span class="item ${cls}">◔ ${text}</span><span class="muted small">${caption}</span></div>`;
  return `<div style="display:grid;gap:6px" aria-label="状态栏示例">${item('105.2k/400k · ≈13.9 tok/s', '', 'Claude Code：上下文 + 最近一次速率')}${item('304k/400k · ≈11.2 tok/s', 'warn', '占用 ≥ 75%，数字变为琥珀色')}${item('372k/400k', 'danger', '占用 ≥ 90% 变红；没有速率时只显示上下文')}${item('364.6k/1.05M', '', 'Antigravity：只有上下文')}</div>`;
}

const modes = { claude: 'used' };
function draw() {
  document.documentElement.dataset.theme = state.theme;
  document.querySelectorAll('.bench button').forEach((b) => b.setAttribute('aria-pressed', String(String(state[b.dataset.k]) === b.dataset.v)));
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div style="display:grid;gap:12px"><div class="muted small">Claude Code</div>${panel(claude, state.w, modes.claude)}</div>
    <div style="display:grid;gap:12px"><div class="muted small">Antigravity</div>${panel(agy, state.w, 'used')}</div>
    <div style="display:grid;gap:12px;width:min(520px,100%)"><div class="muted small">状态栏（右下角）</div>${statusItems()}
      <div class="notes"><b>改动要点</b><ul>
        <li>矩形按分类名固定配色，小块合并为“其他”，图下的图例带颜色、数量和占比。</li>
        <li>上下文数字、进度条和占比合并成一张卡，使用 <span class="nowrap">k / M</span> 简写，原始数字放在下一行。</li>
        <li>指标并排但随宽度自动换行，数字和单位不拆行；缺失的指标用虚线卡片，原因折叠在“为什么没有？”里。</li>
        <li>剩余空间、压缩预留、按需加载单独成组，不并入已用总量。</li>
      </ul></div></div>`;
  stage.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => { modes.claude = b.dataset.mode; draw(); }));
  const tip = document.getElementById('tip');
  stage.querySelectorAll('.tile').forEach((t) => {
    const show = (e) => { const r = t.getBoundingClientRect(); tip.textContent = t.dataset.tip; tip.style.display = 'block'; tip.style.whiteSpace = 'pre-line'; tip.style.left = `${Math.min(innerWidth - 250, e.clientX ? e.clientX + 10 : r.left)}px`; tip.style.top = `${e.clientY ? e.clientY + 12 : r.bottom + 4}px`; };
    t.addEventListener('mousemove', show); t.addEventListener('focus', show); t.addEventListener('mouseleave', () => { tip.style.display = 'none'; }); t.addEventListener('blur', () => { tip.style.display = 'none'; });
  });
}
// 自检：任何元素越出其父元素的右边界都会列出（地图内部的图块除外）。
function overflowReport() {
  const bad = [];
  document.querySelectorAll('.panel *').forEach((e) => {
    if (e.closest('.map') || e.closest('details:not([open])') && e.tagName !== 'SUMMARY' && e.parentElement.tagName === 'DETAILS') return;
    const p = e.parentElement.getBoundingClientRect(), r = e.getBoundingClientRect();
    if (r.width && r.right > p.right + 1) bad.push(`${e.tagName.toLowerCase()}.${e.className} "${(e.textContent || '').trim().slice(0, 24)}" +${Math.round(r.right - p.right)}px`);
  });
  let pre = document.getElementById('overflow');
  if (!pre) { pre = document.createElement('pre'); pre.id = 'overflow'; pre.hidden = true; document.body.append(pre); }
  pre.textContent = bad.length ? `OVERFLOW ${bad.length}\n${bad.join('\n')}` : 'OVERFLOW 0';
}
document.querySelectorAll('.bench button').forEach((b) => b.addEventListener('click', () => { state[b.dataset.k] = b.dataset.k === 'w' ? Number(b.dataset.v) : b.dataset.v; draw(); }));
draw();
overflowReport();
</script>
</body>
</html>
